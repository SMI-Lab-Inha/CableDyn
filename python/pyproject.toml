# Copyright (c) 2026 Jae Hoon Seo, SMI Lab, Inha University
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cabledyn"
version = "0.1.0"
description = "Python APIs for the CableDyn standalone driver and native coupling library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jae Hoon Seo", email = "jaehoon.seo@inha.ac.kr" }]
keywords = [
  "cable dynamics",
  "dynamic power cable",
  "finite element",
  "floating offshore wind",
  "lazy wave",
  "mooring dynamics",
  "MoorDyn",
  "offshore engineering",
  "OpenFAST",
]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SMI-Lab-Inha/CableDyn"
Documentation = "https://cabledyn.readthedocs.io"
Repository = "https://github.com/SMI-Lab-Inha/CableDyn"
Issues = "https://github.com/SMI-Lab-Inha/CableDyn/issues"
Changelog = "https://github.com/SMI-Lab-Inha/CableDyn/blob/main/CHANGELOG.md"
Releases = "https://github.com/SMI-Lab-Inha/CableDyn/releases"
Citation = "https://doi.org/10.1016/j.oceaneng.2026.128332"

[project.scripts]
cabledyn-run = "cabledyn.cli:main"
cabledyn-post = "cabledyn.post_cli:main"
cabledyn-deck = "cabledyn.deck_cli:main"
cabledyn-study = "cabledyn.study_cli:main"

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
post = ["pandas>=2.0", "matplotlib>=3.7"]
dev = [
  "pytest>=7", "pytest-cov>=5", "pandas>=2.0", "matplotlib>=3.7", "ruff>=0.15,<0.17", "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["cabledyn*"]

[tool.setuptools.package-data]
cabledyn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cabledyn"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [
  "RUF001",  # unit labels intentionally use symbols such as the degree sign
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.10"
packages = ["cabledyn"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "pandas", "mpl_toolkits.*"]
ignore_missing_imports = true
