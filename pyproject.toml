# File: pyproject.toml
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2026 Jae Hoon Seo, SMI Lab, Inha University
#
# The published distribution: an sdist of the Fortran sources and platform wheels that carry the
# compiled CableDyn library and the standalone driver inside the `cabledyn` package. The [project]
# table mirrors python/pyproject.toml (the pure-Python package for development against a CMake
# build tree); tests/test_packaging_metadata.py keeps the two identical.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "cabledyn"
version = "0.2.0"
description = "Python APIs for the CableDyn standalone driver and native coupling library"
readme = "python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jae Hoon Seo", email = "jaehoon.seo@inha.ac.kr" }]
keywords = [
  "cable dynamics",
  "dynamic power cable",
  "finite element",
  "floating offshore wind",
  "lazy wave",
  "mooring dynamics",
  "MoorDyn",
  "offshore engineering",
  "OpenFAST",
]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SMI-Lab-Inha/CableDyn"
Documentation = "https://cabledyn.readthedocs.io"
Repository = "https://github.com/SMI-Lab-Inha/CableDyn"
Issues = "https://github.com/SMI-Lab-Inha/CableDyn/issues"
Changelog = "https://github.com/SMI-Lab-Inha/CableDyn/blob/main/CHANGELOG.md"
Releases = "https://github.com/SMI-Lab-Inha/CableDyn/releases"
Citation = "https://doi.org/10.1016/j.oceaneng.2026.128332"

[project.scripts]
cabledyn-run = "cabledyn.cli:main"
cabledyn-post = "cabledyn.post_cli:main"
cabledyn-deck = "cabledyn.deck_cli:main"
cabledyn-study = "cabledyn.study_cli:main"

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
post = ["pandas>=2.0", "matplotlib>=3.7"]
dev = [
  "pytest>=7", "pytest-cov>=5", "pandas>=2.0", "matplotlib>=3.7", "ruff>=0.15,<0.16", "mypy>=1.10",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
# Only the products the wheel carries: the C-ABI library and the standalone driver (the test
# programs are configured but not built), installed into the package by the `python` component.
build.targets = ["cabledyn_shared", "cabledyn"]
install.components = ["python"]
wheel.packages = ["python/cabledyn"]
# The package reaches the library through ctypes, with no Python extension module: one wheel per
# platform serves every supported Python version.
wheel.py-api = "py3"
# The source distribution: every file git does not ignore except the validation records, the
# manual, the OpenFAST integration and the release tooling; it keeps the sources, the tests the
# CMake configuration registers, the examples they run and the Python package (gitignore-style
# patterns, anchored at the project root).
sdist.exclude = [
  "/validation/", "/doc/", "/integration/", "/release/", "/.github/", "/build*/",
  "**/__pycache__/", "*.pyc",
]

[tool.scikit-build.cmake.define]
# Serial like the release executables: no OpenMP runtime to bundle, and the same results on
# every machine.
CABLEDYN_ENABLE_OPENMP = false
