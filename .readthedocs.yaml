# Read the Docs build configuration for CableDyn.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: doc/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: doc/requirements.txt
    - method: pip
      path: python

# Offer the manual as downloadable PDF and EPUB alongside the HTML site.
formats:
  - pdf
  - epub
